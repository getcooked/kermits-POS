# Keep Gradle within the headroom available on typical 16 GB developer machines.
# R8 otherwise can fail with a native-memory OOM while the daemon holds a 2 GB heap.
org.gradle.jvmargs=-Xmx1024m -Xms256m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
